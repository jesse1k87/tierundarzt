name: deploy
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'src/**'
      - '.github/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASS: ${{ secrets.FTP_PASS }}
    steps:
      - uses: actions/checkout@v3
      - run: npm install
      - run: npm run build
      - run: node deploy.js
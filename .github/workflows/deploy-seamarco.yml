name: Deploy seamarco

on:
  push:
    branches: [main]
    paths:
      - 'sites/seamarco/**'

concurrency:
  group: deploy-seamarco-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy seamarco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=sites/seamarco

      - name: Deploy
        run: npm run deploy --workspace=sites/seamarco
        env:
          FTP_PASS: ${{ secrets.SEAMARCO_FTP_PASS }}

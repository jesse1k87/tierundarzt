<header class="bg-pine">
  <nav aria-label="Hauptnavigation" class="px-6 py-4 md:p-6 lg:py-6 xl:py-8 flex flex-nowrap flex-wrap justify-between">
    <div class="flex flex-col justify-center self-start">
      {#- `alt` is not a valid attribute on <a>; the link had no accessible
          name at all. aria-label gives it one without changing the layout. -#}
      <a
        class="logo flex justify-center items-end h-12 md:h-24 lg:h-32 w-12 md:w-24 lg:w-32"
        aria-label="Tier &amp; Arzt - zur Startseite"
        href="/"
      ></a>
      <div class="text-white text-xs tracking-widest hidden lg:flex self-center">
        TIERARZTPRAXIS
      </div>
    </div>

    <input type="checkbox" class="check hidden" id="checked" />
    <label class="menu-toggle md:hidden lg:hidden order-3 justify-between" for="checked" aria-label="Menü öffnen">
      <span class="bar top"></span>
      <span class="bar middle"></span>
      <span class="bar bottom"></span>
    </label>

    <div id="menu" class="hidden md:flex items-center flex-grow md:flex md:w-auto">
      <ul class="justify-end flex-1 md:pt-0 md:flex">
        {% for item in settings.pages %}
        <li class="text-center">
          <a
            class="inline-block p-6"
            href="{{ item.url }}"
            {% if item.external %}target="_blank" rel="noopener"{% endif %}
          >
            <span class="button text-white {{ 'border-b-2 border-white' if page.url == item.url  }}"
              >{{ item.title }}{% if item.external %}
              <svg
                class="inline-block h-3.5 w-3.5 -mt-1 ml-0.5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                <polyline points="15 3 21 3 21 9" />
                <line x1="10" y1="14" x2="21" y2="3" />
              </svg>
              <span class="sr-only">(öffnet in neuem Tab)</span>
              {% endif %}</span
            >
          </a>
        </li>
        {% endfor %}

        <!-- <li class="text-center">
          <a class="inline-block p-6" href="tel:{{ settings.telephone_clean }}">
            <span class="button text-white {{ 'border-b-2 border-white' if page.url == item.url  }}"
              >{{ settings.telephone }}</span
            >
          </a>
        </li> -->
      </ul>
    </div>
  </nav>
</header>
